name: Anvil Organizer aarch64 AppImage

# Builds Anvil Organizer (https://github.com/Marc1326/Anvil-Organizer)
# natively on GitHub's ARM64 runners as an aarch64 AppImage, then boot-tests it
# on real aarch64 Linux before anything is published.
#
# Why Ubuntu 24.04: PySide6's only Linux ARM64 wheels are manylinux_2_39, so the
# build (and every target) needs glibc >= 2.39. SteamOS (Arch-based) is newer.
#
# What this proves: correct architecture, glibc floor, self-contained bundle,
# and that the Qt GUI starts on a native aarch64 kernel (X11 + Wayland).
# What it can't prove: behaviour on the Steam Frame's own SoC/GPU/SteamOS build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Anvil-Organizer branch/tag/commit to build"
        default: main
      publish:
        description: "Create a GitHub release with the AppImage"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 1"   # weekly smoke build of upstream main
  push:
    paths: [".github/workflows/anvil-aarch64-appimage.yml"]

env:
  MAX_GLIBC: "2.39"       # PySide6 aarch64 wheel floor

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      file: ${{ steps.meta.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Marc1326/Anvil-Organizer
          ref: ${{ inputs.ref || 'main' }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils file wget squashfs-tools desktop-file-utils \
            libgl1 libegl1 libxkbcommon0 libxcb-cursor0
          # UPX must NOT be present: the upstream spec sets upx=True and UPX
          # can corrupt Qt libs on aarch64.
          ! command -v upx

      - name: Read version
        id: meta
        run: |
          v=$(grep -m1 '^VERSION=' src/build-appimage.sh | cut -d'"' -f2 || true)
          [ -n "$v" ] || v=$(grep -m1 '^version' src/pyproject.toml | cut -d'"' -f2)
          [ -n "$v" ] || v=0.0.0
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "file=Anvil_Organizer-$v-aarch64.AppImage" >> "$GITHUB_OUTPUT"

      - name: Install Python deps (must resolve to aarch64 wheels)
        working-directory: src
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip wheel
          .venv/bin/pip install -r requirements.txt pyinstaller
          # Fail early if PySide6 fell back to something that isn't native aarch64
          .venv/bin/python - <<'PY'
          import platform, PySide6, pathlib, subprocess
          assert platform.machine() == "aarch64", platform.machine()
          so = next(pathlib.Path(PySide6.__file__).parent.glob("QtCore*.so"))
          out = subprocess.check_output(["file", "-b", str(so)], text=True)
          print(PySide6.__version__, out)
          assert "ARM aarch64" in out, out
          PY

      - name: PyInstaller build (upstream spec)
        working-directory: src
        run: |
          .venv/bin/pyinstaller anvil-organizer.spec --noconfirm 2>&1 | tail -20
          test -x dist/anvil-organizer/anvil-organizer

      - name: Assemble AppDir
        working-directory: src
        run: |
          APPDIR=AnvilOrganizer.AppDir
          rm -rf "$APPDIR"; mkdir -p "$APPDIR/usr/bin"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/anvil-organizer" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/anvil-organizer.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Anvil Organizer
          Exec=anvil-organizer
          Icon=anvil-organizer
          Type=Application
          Categories=Game;Utility;
          Comment=Native Linux Mod Manager
          DESKTOP
          desktop-file-validate "$APPDIR/anvil-organizer.desktop"

          cp anvil/resources/logo.png "$APPDIR/anvil-organizer.png"
          cp -a dist/anvil-organizer/* "$APPDIR/usr/bin/"

          # Same host-lib policy as upstream's build-appimage.sh:
          # readline/tinfo break host subprocesses via LD_LIBRARY_PATH leaks,
          # bundled libxkbcommon segfaults on some distros (upstream #86/#90).
          rm -f "$APPDIR/usr/bin/_internal"/libreadline.so* \
                "$APPDIR/usr/bin/_internal"/libtinfo.so* \
                "$APPDIR/usr/bin/_internal"/libxkbcommon.so* \
                "$APPDIR/usr/bin/_internal"/libxkbcommon-x11.so*

          # Proton shims are data (Windows DLLs for Proton), must be present
          test -d "$APPDIR/usr/bin/_internal/anvil/data/shims" \
            || { echo "shims dir missing from bundle"; exit 1; }

      - name: Build AppImage (aarch64 appimagetool)
        working-directory: src
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          mkdir -p ../dist
          OUT="../dist/${{ steps.meta.outputs.file }}"
          ARCH=aarch64 /tmp/appimagetool --appimage-extract-and-run AnvilOrganizer.AppDir "$OUT"
          chmod +x "$OUT"
          (cd ../dist && sha256sum "${{ steps.meta.outputs.file }}" > "${{ steps.meta.outputs.file }}.sha256")
          ls -lh ../dist

      # ---------------- static checks (no execution) ----------------
      - name: Static checks (arch, glibc floor, libs)
        run: |
          set -euo pipefail
          A="dist/${{ steps.meta.outputs.file }}"
          file "$A" | grep -q 'ARM aarch64' || { file "$A"; echo "AppImage runtime is not aarch64"; exit 1; }

          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 "$A" --appimage-extract >/dev/null

          echo "== every ELF must be aarch64 (PE shims are not ELF and are ignored) =="
          bad=0
          while IFS= read -r f; do
            if file -b "$f" | grep -q '^ELF'; then
              file -b "$f" | grep -q 'ARM aarch64' || { echo "NOT aarch64: $f"; bad=1; }
            fi
          done < <(find squashfs-root -type f)
          [ $bad -eq 0 ]

          echo "== highest GLIBC symbol required (limit $MAX_GLIBC) =="
          max=$(find squashfs-root -type f -exec sh -c \
                'file -b "$1" | grep -q "^ELF" && objdump -T "$1" 2>/dev/null' _ {} \; \
                | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n1)
          echo "max required glibc: $max"
          [ "$(printf '%s\n%s\n' "$max" "$MAX_GLIBC" | sort -V | tail -n1)" = "$MAX_GLIBC" ] \
            || { echo "glibc floor higher than expected"; exit 1; }

          echo "== unresolved shared libs (informational: host-provided libs are expected) =="
          export LD_LIBRARY_PATH="$PWD/squashfs-root/usr/bin/_internal"
          find squashfs-root -name 'libQt6Gui.so*' -o -name 'libQt6Widgets.so*' | while read -r l; do
            ldd "$l" | grep 'not found' || true
          done | sort -u | tee unresolved.txt
          if [ -s unresolved.txt ]; then
            echo "::notice::Libs expected from the host desktop: $(tr -s ' \t\n' ' ' < unresolved.txt)"
          fi

      - name: Write boot-test script
        run: |
          cat > dist/boot-test.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # usage: [MODE=xcb|wayland] [BOOT_MOUNT=1] boot-test.sh <AppImage> [seconds]
          set -uo pipefail
          APP="$(readlink -f "$1")"; SECS="${2:-25}"; MODE="${MODE:-xcb}"
          WORK="$(mktemp -d)"; LOG="$WORK/boot.log"
          export HOME="$WORK/home"; mkdir -p "$HOME"
          export XDG_RUNTIME_DIR="$WORK/run"; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          # BOOT_MOUNT=1 exercises the real FUSE-mount path users hit; default
          # extract-and-run works in containers without FUSE.
          [ "${BOOT_MOUNT:-0}" = 1 ] || export APPIMAGE_EXTRACT_AND_RUN=1
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QUICK_BACKEND=software NO_AT_BRIDGE=1

          echo "kernel: $(uname -srm)  pagesize: $(getconf PAGESIZE)  mode: $MODE  mount: ${BOOT_MOUNT:-0}"
          [ "$(uname -m)" = "aarch64" ] || { echo "not running on aarch64!"; exit 2; }
          . /etc/os-release 2>/dev/null && echo "distro: $PRETTY_NAME (glibc $(getconf GNU_LIBC_VERSION))"

          if [ "$MODE" = wayland ]; then
            weston --backend=headless --socket=wl-test --no-config >"$WORK/weston.log" 2>&1 & DISP=$!
            export QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=wl-test
            sleep 3
          else
            Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & DISP=$!
            export DISPLAY=:99 QT_QPA_PLATFORM=xcb
            sleep 2
          fi

          "$APP" >"$LOG" 2>&1 & PID=$!
          alive=1
          for _ in $(seq 1 "$SECS"); do
            sleep 1
            kill -0 "$PID" 2>/dev/null || { alive=0; break; }
          done

          rc=0
          if [ $alive -eq 0 ]; then
            wait "$PID"; echo "FAIL: exited early (rc=$?)"; rc=1
          elif [ "$MODE" = xcb ]; then
            wins=$( { xdotool search --onlyvisible --name '.' 2>/dev/null; \
                      xdotool search --onlyvisible --class '.' 2>/dev/null; } | sort -u | wc -l)
            echo "visible X windows: $wins"
            [ "$wins" -ge 1 ] || { echo "FAIL: process alive but no window mapped"; rc=1; }
            command -v import >/dev/null && import -window root "$WORK/s.png" 2>/dev/null \
              && cp "$WORK/s.png" "./screen-$MODE-$(. /etc/os-release; echo "${ID}-${VERSION_ID:-x}").png"
          fi

          # Bundling / platform failures are fatal even if the process limped on
          if grep -Eiq 'Illegal instruction|Segmentation fault|could not load the Qt platform plugin|error while loading shared libraries|cannot open shared object|Failed to load Python|ModuleNotFoundError|ImportError' "$LOG"; then
            echo "FAIL: fatal pattern in log"; rc=1
          fi
          grep -q 'Traceback' "$LOG" && echo "::warning::Python traceback in log (process survived)"

          echo "---- log (tail) ----"; tail -n 40 "$LOG"
          kill "$PID" 2>/dev/null; kill "$DISP" 2>/dev/null
          [ $rc -eq 0 ] && echo "BOOT OK ($MODE)" || echo "BOOT FAILED ($MODE)"
          exit $rc
          SCRIPT
          chmod +x dist/boot-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: anvil-aarch64-appimage
          path: dist/
          if-no-files-found: error

  # ---- real aarch64 kernel; X11 via FUSE mount, X11 extract, Wayland ----
  boot-host:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: anvil-aarch64-appimage, path: dist }
      - name: Runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool imagemagick weston libfuse2t64 \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3
      - run: chmod +x dist/*
      - name: X11 — real AppImage FUSE mount (the path users take)
        run: cd dist && BOOT_MOUNT=1 MODE=xcb ./boot-test.sh ./*.AppImage 25
      - name: X11 — extract-and-run
        run: cd dist && MODE=xcb ./boot-test.sh ./*.AppImage 25
      - name: Wayland (headless weston) — informational
        continue-on-error: true
        run: cd dist && MODE=wayland ./boot-test.sh ./*.AppImage 25
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: boot-host-screenshots, path: dist/screen-*.png, if-no-files-found: ignore }

  # ---- clean distros with newer glibc, like SteamOS (Arch-based) will have ----
  boot-clean-distros:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04",  pm: apt }
          - { image: "debian:trixie", pm: apt }     # glibc 2.41, closest to SteamOS
          - { image: "fedora:latest", pm: dnf }
    container: ${{ matrix.image }}
    steps:
      - name: Minimal Qt desktop runtime (what a KDE/Plasma system already has)
        run: |
          if [ "${{ matrix.pm }}" = apt ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xvfb xdotool imagemagick ca-certificates file \
              libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
              libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
              libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3
          else
            dnf install -y xorg-x11-server-Xvfb xdotool ImageMagick file \
              mesa-libGL mesa-libEGL libxkbcommon libxkbcommon-x11 \
              xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm \
              fontconfig dbus-libs
          fi
      - uses: actions/download-artifact@v4
        with: { name: anvil-aarch64-appimage, path: dist }
      - name: Boot test (X11)
        run: chmod +x dist/*; cd dist && MODE=xcb ./boot-test.sh ./*.AppImage 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: dist/screen-*.png
          if-no-files-found: ignore

  release:
    if: ${{ inputs.publish }}
    needs: [build, boot-host, boot-clean-distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: anvil-aarch64-appimage, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: anvil-aarch64-v${{ needs.build.outputs.version }}
          name: Anvil Organizer ${{ needs.build.outputs.version }} (aarch64 AppImage)
          files: |
            dist/*.AppImage
            dist/*.sha256
          body: |
            Unofficial aarch64 build of Anvil Organizer ${{ needs.build.outputs.version }}.
            Requires glibc 2.39+ (PySide6 aarch64 wheel floor) and a Qt-capable desktop
            (libxkbcommon, libxcb-cursor0, GL/EGL) provided by the host.
